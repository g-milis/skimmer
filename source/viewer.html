<!doctype html>
<meta charset="utf-8">
<title>Skim Tool</title>
<style>
  body { margin: 0; background: #525659; font: 15px sans-serif; }
  .page { position: relative; margin: 12px auto; background: #fff; box-shadow: 0 1px 4px #0006; }
  .page canvas { display: block; width: 100%; height: 100%; }
  .page i { position: absolute; background: #fff; pointer-events: none; } /* fades the word underneath */
  .page a { position: absolute; z-index: 1; } /* links from the PDF */
  /* PDF.js text layer: invisible text over the page, for selecting, copying and find (from pdf_viewer.css) */
  .textLayer { position: absolute; inset: 0; overflow: clip; line-height: 1; transform-origin: 0 0; --min-font-size: 1;
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size)); --min-font-size-inv: calc(1 / var(--min-font-size)); }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { --font-height: 0; --scale-x: 1; --rotate: 0deg;
    font-size: calc(var(--text-scale-factor) * var(--font-height)); transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgb(0 0 255 / 0.25); color: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; user-select: none; }
  #msg { color: #fff; text-align: center; margin: 40vh 16px; }
</style>
<div id="msg">Loading…</div>
<script type="module" src="viewer.js"></script>
